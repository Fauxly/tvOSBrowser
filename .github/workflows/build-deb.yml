name: Build tvOS DEB

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      - name: List schemes
        run: |
          xcodebuild -list -project _Project/Browser.xcodeproj

      - name: Build tvOS app
        run: |
          xcodebuild \
            -project _Project/Browser.xcodeproj \
            -scheme Browser \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built app
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "*.app"

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          echo "Found app:"
          echo "$APP_PATH"

      - name: Create package structure
        run: |
          mkdir -p package/Applications
          mkdir -p package/DEBIAN

      - name: Copy app
        run: |
          cp -R "$APP_PATH" package/Applications/

      - name: Create control file
        run: |
          cat > package/DEBIAN/control << EOF
          Package: com.fauxly.browser
          Name: Browser
          Version: 1.0
          Architecture: iphoneos-arm
          Description: tvOS browser for Apple TV
          Maintainer: Fauxly
          Author: Fauxly
          Section: Applications
          Depends: firmware (>= 13.0)
          EOF

      - name: Sign binaries
        run: |
          find package/Applications -type f -perm +111 -exec ldid -S {} \; || true

      - name: Build DEB package
        run: |
          dpkg-deb -b package com.fauxly.browser_1.0_appletvos-arm64.deb

      - name: Verify package
        run: |
          ls -lah
          file Browser.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          files: Browser.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}