name: Build tvOS DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install dpkg ldid

      - name: Build app
        run: |
          xcodebuild \
            -project tvOSBrowser.xcodeproj \
            -scheme tvOSBrowser \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "tvOSBrowser.app" | head -n 1)

          echo "APP_PATH=$APP" >> $GITHUB_ENV

          echo "Found app:"
          echo $APP

      - name: Create package
        run: |
          mkdir -p deb/Applications
          mkdir -p deb/DEBIAN

          cp -R "$APP_PATH" deb/Applications/

      - name: Create control
        run: |
          cat > deb/DEBIAN/control << EOF
          Package: com.fauxly.tvosbrowser
          Name: tvOSBrowser
          Version: 1.0
          Architecture: iphoneos-arm
          Description: tvOS Browser
          Maintainer: Fauxly
          Author: Fauxly
          Section: Applications
          Depends: firmware (>= 13.0)
          EOF

      - name: Sign binaries
        run: |
          find deb/Applications -type f -perm +111 -exec ldid -S {} \; || true

      - name: Build deb
        run: |
          dpkg-deb -b deb tvOSBrowser.deb

      - name: Verify files
        run: |
          ls -lah
          file tvOSBrowser.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-DEB
          path: tvOSBrowser.deb