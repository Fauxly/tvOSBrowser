name: Build tvOS DEB

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: ls -R

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      - name: List Xcode schemes
        run: |
          xcodebuild -list -project tvOSBrowser/tvOSBrowser.xcodeproj

      - name: Build tvOS app
        run: |
          xcodebuild \
            -project _Project/tvOSBrowser.xcodeproj \
            -scheme tvOSBrowser \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "tvOSBrowser.app" | head -n 1)

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          echo "Found app:"
          echo "$APP_PATH"

      - name: Create DEB structure
        run: |
          mkdir -p package/Applications
          mkdir -p package/DEBIAN

      - name: Copy app into package
        run: |
          cp -R "$APP_PATH" package/Applications/

      - name: Create control file
        run: |
          cat > package/DEBIAN/control << EOF
          Package: com.fauxly.tvosbrowser
          Name: tvOSBrowser
          Version: 1.0
          Architecture: iphoneos-arm
          Description: tvOS web browser for Apple TV
          Maintainer: Fauxly
          Author: Fauxly
          Section: Applications
          Depends: firmware (>= 13.0)
          EOF

      - name: Sign binaries
        run: |
          find package/Applications -type f -perm +111 -exec ldid -S {} \; || true

      - name: Build DEB package
        run: |
          dpkg-deb -b package tvOSBrowser.deb

      - name: Verify package
        run: |
          ls -lah
          file tvOSBrowser.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-DEB
          path: tvOSBrowser.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          files: tvOSBrowser.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}