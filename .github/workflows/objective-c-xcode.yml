name: build tvOS Browser

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # 🔧 Сборка архива
      - name: Build archive
        run: |
          xcodebuild \
          -project _Project/Browser.xcodeproj \
          -scheme Browser \
          -destination 'generic/platform=tvOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          archive \
          -archivePath build/App.xcarchive

      # 📦 Делаем IPA вручную (правильная структура!)
      - name: Create unsigned IPA
        run: |
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r Browser.ipa Payload

      # 📤 Загружаем IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: browser-ipa
          path: Browser.ipa

      # 📤 Загружаем архив (на всякий случай)
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive
          path: build/App.xcarchive


  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: browser-ipa
          path: build/

      - name: Create tag
        run: |
          TAG="tvos_$(date +'%Y%m%d%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: tvOS build (${{ env.TAG }})
          prerelease: true
          files: build/Browser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
