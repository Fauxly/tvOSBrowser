name: Build tvOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure (debug)
        run: ls -R

      - name: Build archive
        run: |
          xcodebuild \
          -project _Project/Browser.xcodeproj \
          -scheme Browser \
          -destination 'generic/platform=tvOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          archive \
          -archivePath build/App.xcarchive

      # 👉 Создаём IPA вручную
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/

          cd Payload
          zip -r ../Browser.ipa .
          cd ..

      # 👉 Загружаем IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Browser.ipa

      # 👉 Загружаем архив (на всякий случай)
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive
          path: build/App.xcarchive
