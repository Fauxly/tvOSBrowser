name: Build DEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      - name: Build tvOS app
        run: |
          xcodebuild \
            -project tvOSBrowser.xcodeproj \
            -scheme tvOSBrowser \
            -configuration Release \
            -sdk appletvos \
            build

      - name: Create package structure
        run: |
          mkdir -p package/Applications
          mkdir -p package/DEBIAN

      - name: Copy app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "tvOSBrowser.app" | head -n 1)
          cp -R "$APP_PATH" package/Applications/

      - name: Create control file
        run: |
          cat <<EOF > package/DEBIAN/control
          Package: com.fauxly.tvosbrowser
          Name: tvOSBrowser
          Version: 1.0
          Architecture: iphoneos-arm
          Description: Web browser for tvOS
          Maintainer: Fauxly
          Author: Fauxly
          Section: Applications
          Depends: firmware (>= 13.0)
          EOF

      - name: Sign app
        run: |
          find package/Applications/tvOSBrowser.app -type f -perm +111 -exec ldid -S {} \; || true

      - name: Build DEB package
        run: |
          dpkg-deb -b package tvOSBrowser.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-deb
          path: tvOSBrowser.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: tvOSBrowser.deb
          tag_name: v1.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}